[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agentgit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "python-dotenv",
    "tabulate",
]

[tool.setuptools.packages.find]
include = ["agentgit*"]

